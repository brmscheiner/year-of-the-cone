items:
  - common: Jack Juniper
    scientific: Juniperus jackii
    date: August 26
    location: Mt Hood National Forest, Ore
    notes: >-
      The newest member of the Conifer Pantheon of the United States, and
      specifically the Pacific Northwest.  This little matted, low-laying shrub
      grows sparingly on exposed rocky outcrops on either volcanic or serpentine
      soils from the Siskiyous of Southern Oregon and Northern California up the
      spine of the Cascades to the Olympics of Northwestern Washington. 


      It shares a lot in common with, well, common juniper (Juniperus communis) and was for many years considered a variety of it (J. communis var. jackii).  However, research by Dr. R. P. Adams and others showed that it's actually more closely related to a similar juniper in Taiwan (J. formosana), and it likely is a long-lost population of this species that immigrated to North America in the belly of a bird. 


      Look for low, sprawling shrubs with long tendrils snaking out from a matted base.  The leaves are curved like a small boat with the bottom nearly entirely covered in white stomatal bloom, and they almost lay right on top of the leaves further down the twig.  
    youtube: https://youtu.be/-kQ90sT9Fgg?si=ewAmvXGT4oaBnZzI
  - common: Pitch Pine
    scientific: Pinus resinosa
    date: June 7, 2026
    location: Shawangunk Ridge, New York
    notes: >-
      Pitch pine is the ultimate survivor.  Like most pines, it's able to grow
      in the worst of the worst situations, and it's supremely adapted to
      dealing with fire.  However, unlike other species, it didn't specialize in
      a particular strategy to deal with fire; instead, it opted to get really
      good at them all.


      Fires can occur in a given forest at lots of different intervals and different intensities.  Different trees will adapt to these conditions accordingly. Ponderosa, Jeffrey, slash, and longleaf pines all adapted to frequent, low-intensity fires; knobcone, pond, lodgepole, and bishop pines adapted to semi-frequent, high-intensity fires; and others, like redwoods, some junipers, and lots of broadleaf trees adapted by simply re-sprouting from their bases.  Pitch pine does all three.


      Splendidly able to survive in the varied and intense landscape of New England and the Appalachian Mountains, pitch pine simply outsmarts other trees and creates some of the most picturesque stands on the region. 
    youtube: https://youtu.be/64pbYjPLHgA?si=F6PW1JH4Z8fy7SDJ
